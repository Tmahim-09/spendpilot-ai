name: CI

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test
        env:
          GEMINI_API_KEY: test-dummy-api-key
          CHANNEL3_API_KEY: test-dummy-ch3-key
          PAYPAL_CLIENT_ID: test-paypal-client-id
          PAYPAL_CLIENT_SECRET: test-paypal-client-secret
          PAYPAL_CHECKOUT_SIGNING_SECRET: test-signing-secret-ci-32-bytes-minimum-key!

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: test-paypal-client-id
          PAYPAL_CHECKOUT_SIGNING_SECRET: test-signing-secret-ci-32-bytes-minimum-key!

